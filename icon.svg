<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="短剧之家">
  <!-- 站点图标（favicon / 主屏图标）。
       原模板的 icon.svg 是 Lumen 那道光束标记，必须整块换掉。
       设计约束：浏览器标签页只有 16px，任何中文小字都会糊成一团，
       所以只用「深色 App 方块 + 蓝色播放键」这一个高对比形状。
       蓝色取自站内主按钮（hero 的「免费下载」），保持同一套配色。 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26262f"/>
      <stop offset=".55" stop-color="#111116"/>
      <stop offset="1" stop-color="#07070a"/>
    </linearGradient>
    <linearGradient id="pl" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8cc6ff"/>
      <stop offset=".5" stop-color="#3d8bff"/>
      <stop offset="1" stop-color="#1f5cff"/>
    </linearGradient>
    <radialGradient id="glow" cx=".3" cy=".16" r=".85">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".17"/>
      <stop offset=".62" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>
  <rect width="64" height="64" rx="15" fill="url(#glow)"/>
  <!-- 播放三角：同色 stroke + 圆角 join，把尖角磨圆，小尺寸下不扎眼 -->
  <path d="M25 20.5 L44 32 L25 43.5 Z" fill="url(#pl)" stroke="url(#pl)"
        stroke-width="4" stroke-linejoin="round"/>
</svg>
